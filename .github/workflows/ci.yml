name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================
  # BACKEND UNIT TESTS (JEST)
  # ===========================
  backend-tests:
    name: Backend Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Jest tests with coverage
        working-directory: ./backend
        run: npm test -- --coverage

  # ===========================
  # FRONTEND + BACKEND CYPRESS
  # ===========================
  e2e-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Jest tests (E2E placeholder)
        working-directory: ./backend
        run: npm test

  # ===========================
  # BACKEND CUCUMBER TESTS
  # ===========================
  backend-cucumber:
    name: Backend Cucumber Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Cucumber tests
        working-directory: ./backend
        run: npm run cucumber
